<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史时间轴 · 中外对照</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 时代背景图层（双层交叉淡入淡出） -->
<div class="era-bg-layer" id="eraBg1"></div>
<div class="era-bg-layer" id="eraBg2"></div>

<!-- 浮动装饰 -->
<div class="floating-deco cloud-1">☁️</div>
<div class="floating-deco cloud-2">☁️</div>
<div class="floating-deco cloud-3">☁️</div>

<div class="header">
  <h1><span class="sparkle left">✦</span> 历史<span class="accent">时间轴</span> · 中外对照 <span class="sparkle right">✦</span></h1>
  <div class="sub">CHINA & WORLD · A JOURNEY THROUGH TIME</div>
</div>

<div class="zone-label zone-china">中国历史</div>
<div class="zone-label zone-world">世界历史</div>

<button class="toggle-btn" id="toggleBtn" aria-label="切换循环滚动">
  <span class="toggle-icon"></span>
  <span class="toggle-text">已暂停</span>
</button>

<div class="search-bar" id="searchBar">
  <input type="text" id="searchInput" placeholder="搜索历史事件…" autocomplete="off">
  <button id="searchBtn" aria-label="搜索">🔍</button>
  <div class="search-results" id="searchResults"></div>
</div>

<div class="timeline-wrapper">
  <div class="track" id="timelineTrack"></div>
</div>

<div class="footer-hint">← 拖拽浏览 · 点击卡片或朝代查看详情 · 鼠标滚轮可滑动 →</div>

<div class="version-tag">v3.2</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-emoji">📜</div>
  <div class="loading-text">正在打开历史画卷</div>
  <div class="loading-detail" id="loadingDetail">初始化 sql.js…</div>
</div>

<script src="script.js"></script>
</body>
</html>
